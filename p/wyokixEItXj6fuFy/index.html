<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>解説動画にPNGTuberを置くと、こんな感じ🎤</title>
<style>
  :root { --bg:#faf7f2; --fg:#2b2b2b; --sub:#777; --btn:#2b2b2b; --btnfg:#fff; --line:#e3ddd3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:4px 0 12px; }
  .btns { display:grid; gap:10px; margin:12px 0 16px; }
  button { font:inherit; font-size:16px; padding:14px; border:0; border-radius:12px; background:var(--btn); color:var(--btnfg); }
  button.sub { background:#fff; color:var(--fg); border:1px solid var(--line); }
  textarea { width:100%; height:220px; font:inherit; font-size:14px; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
  .grid a { position:relative; display:block; }
  .grid img, .grid video { width:100%; display:block; border-radius:6px; }
  .grid.one { grid-template-columns:1fr; }
  .grid span { position:absolute; left:4px; top:4px; background:rgba(0,0,0,.6); color:#fff; font-size:12px; padding:1px 6px; border-radius:8px; }
  .msg { color:var(--sub); font-size:13px; min-height:1.2em; }
</style>
</head>
<body>
<main>
  <h1>解説動画にPNGTuberを置くと、こんな感じ🎤</h1>
  <div class="btns">
    <button id="share">動画と文章をTikTokに渡す</button>
    <button id="copy" class="sub">文章をコピー</button>
    <button id="save" class="sub">動画を保存</button>
  </div>
  <p class="msg" id="msg"></p>
  <textarea id="text" readonly>解説動画にPNGTuberを置くと、こんな感じ🎤

✔ 声に合わせて口が動く
✔ まばたきも自動
✔ 顔出しなしで、解説・ゆっくり系の動画が作れます

PNGTuberのご相談はプロフィールのリンクから！

VOICEVOX:青山龍星

#PNGTuber #Vtuber #Vtuber準備中 #解説動画 #三億円事件</textarea>
  <div class="grid one">
    <div><video src="01.mp4" controls playsinline preload="metadata"></video></div>
  </div>
</main>
<script>
const files = ["01.mp4"];
const msg = t => document.getElementById('msg').textContent = t;
// TikTokは空の行を消すことがあるので、コピーする文章では空の行に見えない文字（点字の空白 U+2800）を入れる
const text = () => document.getElementById('text').value.replace(/^[ 	　]*$/gm, '⠀');

async function copyText() {
  try { await navigator.clipboard.writeText(text()); }
  catch (e) { const t = document.getElementById('text'); t.select(); document.execCommand('copy'); }
  msg('文章をコピーしました');
}
document.getElementById('copy').onclick = copyText;

document.getElementById('save').onclick = async () => {
  for (const f of files) {
    const a = document.createElement('a');
    a.href = f; a.download = f; document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 600));
  }
  msg('保存を始めました。「複数のファイルのダウンロード」を聞かれたら許可してください');
};

// 共有はボタンを押した直後でないと開けないので、画像はページを開いた時点で読み込んでおく
let shareFiles = null;
Promise.all(files.map(f => fetch(f).then(r => r.blob())))
  .then(blobs => { shareFiles = blobs.map((b, i) => new File([b], files[i], { type: files[i].endsWith('.mp4') ? 'video/mp4' : 'image/jpeg' })); })
  .catch(e => msg('画像の読み込みに失敗しました: ' + e.message));

document.getElementById('share').onclick = () => {
  if (!shareFiles) { msg('画像を読み込み中です。数秒待ってからもう一度押してください'); return; }
  if (!navigator.canShare || !navigator.canShare({ files: shareFiles })) {
    msg('このブラウザは共有に対応していません。下の保存ボタンを使ってください');
    return;
  }
  navigator.clipboard.writeText(text()).catch(() => {});
  navigator.share({ files: shareFiles })
    .then(() => msg('文章はコピー済みです。TikTokの投稿画面で貼り付けてください'))
    .catch(e => { if (e.name !== 'AbortError') msg('共有できませんでした（' + e.name + '）: ' + e.message); });
};
</script>
</body>
</html>
